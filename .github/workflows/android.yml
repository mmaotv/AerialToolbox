# 构建 release APK 并作为 artifact 上传。
#
# 只做「能编译、能出包」这一件事：不需要密钥、不发布 Release。
# 正式发布仍按 README 的「构建」章节本地签名打包，再上传到 Releases。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 36：与本地 build.gradle.kts 保持一致，缺哪个装哪个
      - name: 安装 SDK 组件
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 编译 release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 重命名产物并计算校验和
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "AerialToolbox-${VERSION}.apk"
          sha256sum "AerialToolbox-${VERSION}.apk" | tee "AerialToolbox-${VERSION}.apk.sha256"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AerialToolbox-${{ env.VERSION }}
          path: |
            AerialToolbox-*.apk
            AerialToolbox-*.apk.sha256
          if-no-files-found: error
          retention-days: 30

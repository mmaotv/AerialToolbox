# 构建 release APK 并作为 artifact 上传。
#
# 只做「能编译、能出包」这一件事：不需要密钥、不发布 Release。
# 正式发布仍按 README 的「构建」章节本地签名打包，再上传到 Releases。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设好）。
      # 不要用 android-actions/setup-android：它默认装的老 "tools" 包已经下架，会直接失败。
      - name: 安装 SDK 组件
        run: |
          set -euo pipefail
          SDKMANAGER=$(command -v sdkmanager || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: 编译 release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 重命名产物并计算校验和
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          PHONE_VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' phone/build.gradle.kts | head -n1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PHONE_VERSION=$PHONE_VERSION" >> "$GITHUB_ENV"
          # 电视端
          cp app/build/outputs/apk/release/app-release.apk "AerialToolbox-${VERSION}.apk"
          sha256sum "AerialToolbox-${VERSION}.apk" | tee "AerialToolbox-${VERSION}.apk.sha256"
          # 手机端
          cp phone/build/outputs/apk/release/phone-release.apk "AerialToolbox-Phone-${PHONE_VERSION}.apk"
          sha256sum "AerialToolbox-Phone-${PHONE_VERSION}.apk" | tee "AerialToolbox-Phone-${PHONE_VERSION}.apk.sha256"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AerialToolbox-${{ env.VERSION }}
          path: |
            AerialToolbox-*.apk
            AerialToolbox-*.apk.sha256
          if-no-files-found: error
          retention-days: 30
